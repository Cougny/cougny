# Full containerized stack: builds and runs all three apps on top of the shared
# infrastructure (postgres, redis, coturn) defined in infra/docker-compose.yml.
#
#   cp apps/api/.env.example apps/api/.env         # and likewise per app
#   docker compose up -d --build          # start everything
#   docker compose run --rm db-provision  # create the two app roles (first run)
#   docker compose run --rm db-migrate    # apply migrations (first run)
#
# For infra-only local dev (apps via `pnpm dev`), use `pnpm infra:up` instead.
#
# Mirrors production's privilege split: apps connect as the row-only cougny_app,
# migrations as the schema-owning cougny_migrator. Passwords are unguarded
# defaults here because nothing outside this compose network can reach Postgres.
name: cougny

include:
  - infra/docker-compose.yml

x-app-database-url: &app-database-url postgresql://cougny_app:${POSTGRES_APP_PASSWORD:-cougny_app}@postgres:5432/${POSTGRES_DB:-cougny}?schema=public

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: apps/api/.env
    environment:
      NODE_ENV: production
      # Reach infra by compose service name (overrides the localhost .env values).
      DATABASE_URL: *app-database-url
      REDIS_URL: redis://redis:6379
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  signaling:
    build:
      context: .
      dockerfile: apps/signaling/Dockerfile
    env_file: apps/signaling/.env
    environment:
      NODE_ENV: production
      # Reach infra by compose service name (overrides the localhost .env values).
      DATABASE_URL: *app-database-url
      REDIS_URL: redis://redis:6379
    ports:
      - '4001:4001'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the client bundle at build time (browser-reachable URLs).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SIGNALING_URL: ${NEXT_PUBLIC_SIGNALING_URL:-ws://localhost:4001}
    ports:
      - '3000:3000'
    depends_on:
      - api
      - signaling
    restart: unless-stopped

  # One-shot helper: create the cougny_migrator and cougny_app roles as the
  # superuser. Idempotent, and a prerequisite for db-migrate. Not started by `up`.
  db-provision:
    image: postgres:18-alpine
    profiles: ['tools']
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-cougny}
      PGUSER: ${POSTGRES_USER:-cougny}
      PGPASSWORD: ${POSTGRES_PASSWORD:-cougny}
      MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-cougny_migrator}
      APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-cougny_app}
    volumes:
      - ./packages/db/sql/provision-roles.sql:/sql/provision-roles.sql:ro
    entrypoint: ['sh', '-c']
    command:
      - |
        set -eu
        {
          printf "\\\\set migrator_password '%s'\n" "$$MIGRATOR_PASSWORD"
          printf "\\\\set app_password '%s'\n" "$$APP_PASSWORD"
          cat /sql/provision-roles.sql
        } | psql --quiet --no-psqlrc --set=ON_ERROR_STOP=1
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # One-shot helper: apply committed Prisma migrations. Not started by `up`.
  db-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: tools
    profiles: ['tools']
    command: ['pnpm', 'prisma', 'migrate', 'deploy']
    env_file: packages/db/.env
    environment:
      MIGRATE_DATABASE_URL: postgresql://cougny_migrator:${POSTGRES_MIGRATOR_PASSWORD:-cougny_migrator}@postgres:5432/${POSTGRES_DB:-cougny}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
